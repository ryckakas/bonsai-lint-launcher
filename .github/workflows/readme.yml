name: README

# Packagist shows this repository's README, which is bonsai-lint's own at its latest release. After
# a release that changes it, this fails until `go run ./internal/readme` is run and merged; the
# weekly run catches a release that no pull request here has seen yet.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    name: README is bonsai-lint's
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: README.md is bonsai-lint's latest release README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go run ./internal/readme
          if ! git diff --exit-code README.md; then
            echo "::error::README.md is behind bonsai-lint's latest release: run go run ./internal/readme and merge the result"
            exit 1
          fi
